  <ellipse cx="174" cy="281" rx="58" ry="16" fill="#F1F2E9" stroke="#1E2A20" stroke-width="2.5"/>
  <ellipse cx="174" cy="281" rx="42" ry="9" fill="none" stroke="#1E2A20" stroke-width="1.2" opacity="0.4"/>
  <ellipse cx="181" cy="259" rx="58" ry="16" fill="#EEF0E6" stroke="#1E2A20" stroke-width="2.5"/>
  <ellipse cx="181" cy="259" rx="42" ry="9" fill="none" stroke="#1E2A20" stroke-width="1.2" opacity="0.4"/>

  <path d="M181,252 C176,215 192,180 216,146 C224,134 222,120 214,108"
