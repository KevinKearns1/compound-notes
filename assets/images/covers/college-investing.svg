  <rect width="600" height="400" fill="#E3E7D9"/>
  <line x1="60" y1="320" x2="540" y2="320" stroke="#CAD0BC" stroke-width="2"/>

  <rect x="90"  y="280" width="52" height="40"  rx="6" fill="#1B6E5C" opacity="0.85"/>
  <rect x="192" y="240" width="52" height="80"  rx="6" fill="#1B6E5C" opacity="0.88"/>
  <rect x="294" y="190" width="52" height="130" rx="6" fill="#1B6E5C" opacity="0.92"/>
