  <rect x="498" y="60"  width="52" height="260" rx="6" fill="#12503F"/>

  <polyline points="116,280 218,240 320,190 422,130 524,60"
            fill="none" stroke="#1E2A20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

