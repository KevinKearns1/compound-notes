<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="A stack of three overlapping notecards with lines of handwritten-style notes, illustrating lessons collected over time">
  <rect width="600" height="400" fill="#E3E7D9"/>

  <g transform="rotate(-7 300 200)">
    <rect x="170" y="130" width="300" height="180" rx="14" fill="#D9DECB" stroke="#CAD0BC" stroke-width="2"/>
  </g>
  <g transform="rotate(4 300 200)">
    <rect x="160" y="120" width="300" height="180" rx="14" fill="#EEF0E6" stroke="#CAD0BC" stroke-width="2"/>
  </g>

  <rect x="150" y="108" width="300" height="184" rx="14" fill="#F6F7F0" stroke="#1E2A20" stroke-width="2.5"/>
  <line x1="182" y1="152" x2="380" y2="152" stroke="#54604F" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <line x1="182" y1="180" x2="418" y2="180" stroke="#54604F" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  <line x1="182" y1="208" x2="350" y2="208" stroke="#54604F" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <line x1="182" y1="236" x2="390" y2="236" stroke="#1B6E5C" stroke-width="6" stroke-linecap="round"/>

  <circle cx="428" cy="132" r="10" fill="#A9781F"/>
</svg>
