  <path d="M204,272 C224,270 234,286 250,272 C266,258 276,282 296,264
           C312,249 324,268 344,238 C360,214 372,224 396,168
           L396,300 L204,300 Z"
        fill="#1B6E5C" opacity="0.14"/>
  <circle cx="396" cy="168" r="7" fill="#A9781F" stroke="#1E2A20" stroke-width="2"/>

  <rect x="206" y="290" width="60" height="18" rx="4" fill="#EEF0E6" stroke="#1E2A20" stroke-width="2"/>
  <rect x="272" y="290" width="46" height="18" rx="4" fill="#F6F7F0" stroke="#1E2A20" stroke-width="2"/>

  <rect width="600" height="400" filter="url(#grain8)" style="mix-blend-mode:multiply" opacity="0.5"/>
